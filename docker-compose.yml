services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stockwise
      POSTGRES_USER: stockwise
      POSTGRES_PASSWORD: stockwise-dev-only
    ports:
      - "5432:5432"
    volumes:
      - stockwise-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockwise -d stockwise"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - stockwise-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  stockwise-postgres:
  stockwise-redis:
